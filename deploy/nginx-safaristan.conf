# Safaristan — installed at /etc/nginx/sites-available/safaristan (symlinked into sites-enabled).
# Certbot adds the 443 block + redirect: certbot --nginx -d safristan.com -d www.safristan.com
server {
    listen 80;
    listen [::]:80;
    server_name safristan.com www.safristan.com;

    client_max_body_size 20M;
    server_tokens off;

    location ~ ^/(api|admin|media|static)/ {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
