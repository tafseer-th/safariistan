# Safaristan — installed at /etc/nginx/sites-available/safaristan (symlinked into sites-enabled).
# Certbot adds the 443 block + redirect: certbot --nginx -d safristan.com -d www.safristan.com
# Rate limits are in nginx-ratelimit.conf (installed by the Deploy workflow).

# Load balancing: nginx spreads requests over every "server" line in an upstream.
# Today there is one container of each; to scale out, start another copy on a new
# port (or another machine) and add a line, e.g. "server 127.0.0.1:8121;".
# The backend needs PostgreSQL before it can run on more than one machine.
upstream safaristan_backend {
    least_conn;
    server 127.0.0.1:8120 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream safaristan_frontend {
    least_conn;
    server 127.0.0.1:3110 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name safristan.com www.safristan.com safaristan.com www.safaristan.com;

    client_max_body_size 20M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /videos/ {
        proxy_pass http://safaristan_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ ^/(api|admin|media|static)/ {
        proxy_pass http://safaristan_backend;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://safaristan_frontend;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
