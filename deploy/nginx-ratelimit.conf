# Safaristan rate limiting — installed by the Deploy workflow to
# /etc/nginx/conf.d/safaristan-ratelimit.conf (http context).
#
# It lives here instead of the site file because certbot edits the site file,
# and it only applies to the Safaristan domains: for any other site on the
# server the key is empty, and nginx never limits an empty key.
# Limits are per visitor IP. Over the limit nginx answers 503.

map $host $sf_site {
    hostnames;
    .safristan.com  1;
    .safaristan.com 1;
    default         0;
}

map $sf_site $sf_ip {
    1       $binary_remote_addr;
    default "";
}

# API calls made from the visitor's browser (listing filters, booking form).
map "$sf_site:$uri" $sf_api_key {
    "~^1:/api/" $binary_remote_addr;
    default     "";
}

# Admin password guessing.
map "$sf_site:$request_method:$uri" $sf_login_key {
    "~^1:POST:/admin/login/" $binary_remote_addr;
    default                  "";
}

limit_req_zone  $sf_ip        zone=sf_all:10m   rate=30r/s;
limit_req_zone  $sf_api_key   zone=sf_api:10m   rate=10r/s;
limit_req_zone  $sf_login_key zone=sf_login:1m  rate=5r/m;
limit_conn_zone $sf_ip        zone=sf_conn:10m;

# A page load pulls ~30 files (JS, CSS, 12 card images), hence the bursts.
limit_req  zone=sf_all   burst=100 nodelay;
limit_req  zone=sf_api   burst=40  nodelay;
limit_req  zone=sf_login burst=5   nodelay;
limit_conn sf_conn 40;
